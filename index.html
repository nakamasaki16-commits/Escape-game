<script>
const BASE={chapter:0,room:'classroom',view:0,flags:{},items:[],clues:[],logs:[],hint:{},ending:null};let S=JSON.parse(JSON.stringify(BASE));
const rooms={classroom:{name:'2年3組',views:4,pos:[2,4]},hall:{name:'2階廊下',views:4,pos:[2,3]},staff:{name:'職員室',views:4,pos:[1,3]},science:{name:'理科室',views:4,pos:[3,3]},broadcast:{name:'放送室',views:4,pos:[2,2]},old:{name:'旧校舎階段',views:4,pos:[2,1]},rooftop:{name:'屋上前',views:2,pos:[2,0]}};
function sv(){localStorage.setItem('afterschoolSave',JSON.stringify(S));ui()}function ld(){let x=localStorage.getItem('afterschoolSave');if(x)try{S={...BASE,...JSON.parse(x)}}catch(e){}}
function startGame(){S=JSON.parse(JSON.stringify(BASE));localStorage.removeItem('afterschoolSave');document.getElementById('prologue').classList.add('hidden');introSequence()}function continueGame(){ld();document.getElementById('prologue').classList.add('hidden');render()}
function showIntro(){sheet(`<h2>あらすじ</h2><p>放課後の教室で目を覚ましたあなた。完全下校時刻はとうに過ぎ、校舎には人の気配がない。なぜ自分だけがここにいるのか——身近な記録を辿って学校から脱出する。</p><p>スマホ、黒板、鍵当番表、放送記録——身近なものを調べながら、なぜ自分だけが学校に残っているのかを追う。</p><p class="muted">左右で4面の壁を見回し、気になる物をタップ。重要な謎はその時点で得られる証拠だけで解けます。</p>`)}
function introSequence(){sheet(`<div class="dialog"><div class="name">？？？</div>……寒い。</div><p>机に突っ伏していたらしい。蛍光灯は半分消え、窓の外はもう暗い。</p><div class="dialog"><div class="name">自分</div>「……寝てた？」</div><p>スマホを手に取る。時刻は18:42。通知はない。</p><div class="dialog"><div class="name">自分</div>「みんな、帰ったのか……？」</div><button class="choice primary" onclick="closeSheet();addItem('phone','スマートフォン','18:42。圏外。バッテリー31%。');addLog('18:42、2年3組の教室で目を覚ました。');sv();render()">起き上がる</button>`)}
function closeSheet(){document.getElementById('overlay').classList.remove('show')}function sheet(h){document.getElementById('sheet').innerHTML=h;document.getElementById('overlay').classList.add('show')}function toast(t){let e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1500)}function addLog(t){if(!S.logs.includes(t))S.logs.push(t)}function addItem(id,name,desc){if(!S.items.find(x=>x.id===id)){S.items.push({id,name,desc});toast('入手：'+name)}}function addClue(id,name,desc){if(!S.clues.find(x=>x.id===id)){S.clues.push({id,name,desc});addLog('手掛かり「'+name+'」');toast('手掛かり追加：'+name)}}function hasClue(id){return !!S.clues.find(x=>x.id===id)}function hasItem(id){return !!S.items.find(x=>x.id===id)}function turn(d){S.view=(S.view+d+rooms[S.room].views)%rooms[S.room].views;sv();render()}function can(r){if(r==='classroom'||r==='hall')return true;if(r==='staff')return S.chapter>=1;if(r==='science')return S.chapter>=2&&hasItem('staffKey');if(r==='broadcast')return S.chapter>=3&&hasItem('keyTag');if(r==='old')return S.chapter>=4;if(r==='rooftop')return S.chapter>=5;return false}function go(r){if(!can(r)){toast('まだ入れない。');return}S.room=r;S.view=0;sv();render()}
function ui(){document.getElementById('chapTxt').textContent='CHAPTER '+S.chapter;document.getElementById('chapter').textContent='CH.'+S.chapter;document.getElementById('where').textContent=rooms[S.room].name;document.getElementById('wall').textContent='壁 '+(S.view+1)+'/'+rooms[S.room].views;renderMap()}
function renderMap(){
  let cells=[];
  for(let y=0;y<5;y++){
    for(let x=0;x<5;x++){
      const r=Object.keys(rooms).find(k=>rooms[k].pos[0]===x&&rooms[k].pos[1]===y);
      if(!r){
        cells.push('<div class="mapcell"></div>');
        continue;
      }
      const unlocked=can(r), here=S.room===r;
      const click = unlocked && !here ? `onclick="go('${r}')"` : "";
      const role = unlocked ? 'role="button"' : '';
      const extra = unlocked && !here ? ' tappable' : '';
      cells.push(
        `<div class="mapcell ${unlocked?'open':''} ${here?'here':''}${extra}" ${click} ${role}>`+
        `${unlocked?rooms[r].name:"？"}${here?'<span class="arrow">▲</span>':''}</div>`
      );
    }
  }
  document.getElementById("map").innerHTML=cells.join("");
}

function currentObjective(){
  if(S.chapter===0){
    if(!hc("pc") || !hc("clock")) return "教室に残された違和感を調べよう。";
    return "教室の外へ出て、今日の自分の記録を確かめよう。";
  }
  if(S.chapter===1){
    if(!hc("entry") || !hc("absence")) return "今日、自分が学校にいたことになっているのか確かめよう。";
    return "次の手掛かりを探すため、特別教室を調べよう。";
  }
  if(S.chapter===2){
    if(!hc("diagram")) return "理科室に残された文化祭展示を調べよう。";
    if(!hc("hidden")) return "展示装置を動かして、残された手掛かりを探そう。";
    return "17:18に関係する記録を探しに行こう。";
  }
  if(S.chapter===3){
    if(!hc("recorder")) return "放送室で、去年の文化祭前日の記録を探そう。";
    if(!hc("1718")) return "壊れた録音の時系列を復元しよう。";
    return "17:18に何が起きたのか、現場を確かめよう。";
  }
  if(S.chapter===4){
    if(!hc("warning") || !hc("repair")) return "旧校舎で、事故の前から危険が知られていたか確かめよう。";
    if(!hc("uvnote")) return "旧校舎に残された、自分自身の痕跡を探そう。";
    return "集めた証拠から、去年の事件全体を組み立てよう。";
  }
  if(S.chapter===5){
    return "推理ボードで、誰が何を知り、何をしたのか整理しよう。";
  }
  if(S.chapter===6){
    if(!hc("msglog")) return "最後に残った謎――今日の匿名メッセージを調べよう。";
    return "事件の記録をどう扱うか決めよう。";
  }
  return "ここまでの証拠を見直そう。";
}
function updateObjective(){
  const e=document.getElementById("objectiveText");
  if(e) e.textContent=currentObjective();
}

function networkTerminal(){addClue('network','校内ネットワーク端末','去年の文化祭前日の記録一式を外部へ送信可能。校内から削除することもできる。');sheet('<h2>ネットワーク端末</h2><p>去年の記録はまだ校内サーバに残っている。</p><p>外部送信／削除、どちらも可能。</p>')}function finalChoice(){sheet(`<h2>最後の選択</h2><p>手紙、録音、出席簿、今日のログ。全部をここで終わらせることも、外へ残すこともできる。</p><button class="choice primary" ${hasClue('network')?'':'disabled'} onclick="endGame('true')">記録を外部へ送信して、先生に連絡する</button><p class="muted">${hasClue('network')?'':'※外部送信手段をまだ確認していない。'}</p><button class="choice" onclick="endGame('normal')">自分だけ校舎を出る</button><button class="choice bad" onclick="endGame('bad')">去年の記録を全部削除する</button>`)}function endGame(t){S.ending=t;S.chapter=6;sv();if(t==='true')sheet(`<div class="titleline good">TRUE END</div><p>屋上前の端末から記録を送信した。</p><p>数分後、スマホに圏外表示が消える。</p><div class="dialog"><div class="name">担任</div>『今どこにいる？　学校か？』</div><div class="dialog"><div class="name">自分</div>「……先生。去年のこと、聞きたいです。」</div><p>自分が何を忘れたのかは、まだ全部分からない。</p><p>でも、記録を消さずに残すことはできた。</p><hr><p class="muted">翌週。旧校舎のロッカーは撤去された。<br>学校は去年の件について、生徒と保護者への説明を始めた。<br><br>帰り道、スマホに友人からメッセージが届く。<br>『明日、普通に来るよな？』<br><br>あなたは少しだけ迷ってから、『行く』と返した。</p><button class="choice primary" onclick="reset()">タイトルへ</button>`);else if(t==='normal')sheet(`<div class="titleline">NORMAL END</div><p>非常口から外へ出た。</p><p>翌朝、学校は何事もなかったように始まる。</p><p>出席簿の自分の欄だけが、いつの間にか『出席』に直されていた。</p><button class="choice" onclick="reset()">タイトルへ</button>`);else sheet(`<div class="titleline badtext">BAD END</div><p>去年の記録を削除した。</p><p class="code">DELETE COMPLETE</p><p>翌日、教室で目を覚ます。</p><p>壁時計は17:18で止まっている。</p><button class="choice bad" onclick="reset()">タイトルへ</button>`)}function reset(){localStorage.removeItem('afterschoolSave');location.reload()}
function panel(type){if(type==='items')sheet('<h2>持ち物</h2>'+(S.items.length?S.items.map(x=>`<div class="item"><b>${x.name}</b>${x.desc}</div>`).join(''):'<p>何もない。</p>'));else if(type==='clues')sheet('<h2>手掛かり</h2>'+(S.clues.length?S.clues.map(x=>`<div class="clue"><b>${x.name}</b>${x.desc}</div>`).join(''):'<p>まだない。</p>'));else if(type==='log')sheet('<h2>行動ログ</h2>'+(S.logs.length?S.logs.slice().reverse().map(x=>`<div class="log">${x}</div>`).join(''):'<p>まだない。</p>'));else if(type==='map')sheet('<h2>移動</h2>'+Object.keys(rooms).map(r=>`<button class="choice" ${can(r)?'':'disabled'} onclick="closeSheet();go('${r}')">${can(r)?rooms[r].name:'未確認区画'}</button>`).join(''));else{let l=S.hint[S.chapter]||0;sheet(`<h2>ヒント</h2><p>${hint(S.chapter,l)}</p><button class="choice" onclick="moreHint()">もう少しヒント</button>`)}}function moreHint(){S.hint[S.chapter]=(S.hint[S.chapter]||0)+1;sv();panel('hint')}function hint(ch,l){let H={0:['まず現在時刻と、学校の予定を確認しよう。','黒板の完全下校時刻を見る。'],1:['職員室には今日の記録がある。','出席簿とPCログを確認しよう。'],2:['理科室の展示装置には手順が残されている。','文化祭準備メモを見る。'],3:['放送室には去年の記録が残っている。','古い録音機を使う。'],4:['旧校舎のロッカーは普通の光では読めない。','理科室で拾ったUVペンを使う。'],5:['最後は謎ではなく選択。記録を残すか消すか。']};let a=H[ch]||['手掛かりを見直そう。'];return a[Math.min(l,a.length-1)]}function menu(){sheet(`<h2>メニュー</h2><button class="choice" onclick="closeSheet()">戻る</button><button class="choice" onclick="showIntro()">遊び方</button><button class="choice bad" onclick="reset()">セーブ削除</button>`)}

function introSequence(){sheet(`<div class="dialog"><div class="name">？？？</div>……寒い。</div><p>机に突っ伏していたらしい。窓の外はもう暗い。</p><p>スマホは18:42。圏外。ただ、一件だけ開いたままの匿名メッセージがある。</p><p class="code">17:18。2年3組。</p><div class="dialog"><div class="name">自分</div>「これを見て、学校に来た。……そこまでは覚えてる。」</div><p>去年の文化祭前日。自分は学校で事故に遭い、事故前後の記憶を失った。医師からそう聞かされている。</p><button class="choice primary" onclick="closeSheet();addItem('phone','スマートフォン','18:42。匿名メッセージ『17:18。2年3組。』。');addLog('匿名メッセージに呼ばれ、放課後の2年3組へ来た。');sv();render()">起き上がる</button>`)}
function oldLocker(){if(!S.items.find(x=>x.id==='uvPen')){sheet('<h2>古いロッカー</h2><p>扉の内側に透明な線。普通の光では読めない。</p>');return}addClue('letter','事故直後の自分のメモ','「17:18。水野。旧校舎。榊先生は危険を知っていた。録音が消えたら紙と予備機を見ろ。俺は事故のあとを覚えていない。」筆跡は自分のもの。');addClue('warning','事故前の危険通知','事故12日前、施設担当から文化祭担当の榊先生へ「旧校舎踊り場腐食・使用停止継続」の通知。受領印あり。');sheet(`<h2>UVで浮かぶ文字</h2><p>『17:18。水野。旧校舎。榊先生は危険を知っていた。録音が消えたら紙と予備機を見ろ。俺は事故のあとを覚えていない。』</p><div class="dialog"><div class="name">自分</div>「……俺の字だ。」</div><hr><p>ロッカーの底には、事故12日前の施設通知のコピー。</p><p class="code">旧校舎踊り場：腐食<br>使用停止を継続すること<br><span class="important">受領：榊</span></p>`)}

function broadcastSchedule(){addClue('broadcastDuty','去年の放送当番表','紙版では17:00–17:30「水野 悠」。サーバ版では水野の行だけ欠落。');addClue('keylog','旧校舎の鍵貸出記録','文化祭前日16:10、旧校舎の鍵を「榊」名義で貸出。事故後の電子版では該当行が削除。');sheet(`<h2>放送当番表</h2><p>紙版：<span class="code">17:00–17:30　水野 悠</span></p><p>電子版では、その一行だけ存在しない。</p><hr><p>同じファイル束に旧校舎の鍵貸出記録。</p><p class="code">16:10　貸出：榊</p>`)}

function reasoningBoard(){if(S.chapter<4){sheet('<h2>推理ボード</h2><p>まだ事件全体を組み立てるには証拠が足りない。</p>');return}S.board=S.board||{};const rows=[['place','事故場所',['','旧校舎','放送室','2年3組']],['first','第一発見者',['','主人公','水野','榊先生']],['cause','事故原因',['','老朽化した階段','展示装置','停電']],['knew','危険を事前に認識',['','榊先生','主人公','水野']],['alter','記録を改竄',['','榊先生','主人公','施設担当']],['purpose','改竄の目的',['','管理責任の隠蔽','文化祭の成功','主人公を守る']],['memory','記憶喪失の理由',['','事故時の頭部外傷','薬物','超常現象']]];let h='<h2>推理ボード</h2><p>去年17:18に起きたことを再構成する。</p>';for(const [k,l,o] of rows){h+=`<div style="display:grid;grid-template-columns:105px 1fr;gap:8px;align-items:center;margin:7px 0"><span>${l}</span><select onchange="S.board.${k}=this.value;sv()" style="width:100%;padding:10px;background:#0d151d;color:white;border:1px solid #2b3848;border-radius:9px">${o.map(v=>`<option ${S.board[k]===v?'selected':''}>${v}</option>`).join('')}</select></div>`}h+='<button class="choice primary" onclick="judgeReasoning()">推理する</button><p class="muted">間違えてもゲームオーバーにはならない。</p>';sheet(h)}
function judgeReasoning(){const a={place:'旧校舎',first:'主人公',cause:'老朽化した階段',knew:'榊先生',alter:'榊先生',purpose:'管理責任の隠蔽',memory:'事故時の頭部外傷'};let n=Object.keys(a).filter(k=>S.board[k]!==a[k]).length;if(n){sheet(`<h2>推理不成立</h2><p>${n}項目が、集めた証拠と矛盾している。</p><button class="choice" onclick="reasoningBoard()">戻る</button>`);return}S.chapter=5;addLog('推理成立：去年の事故と記録改竄を再構成した。');sv();sheet(`<h2 class="good">推理成立</h2><p>去年17:18、水野は旧校舎の老朽化した階段で事故に遭った。</p><p>榊先生は事故前から危険を知らされながら、文化祭準備で旧校舎を使わせていた。</p><p>主人公は事故を発見して救助を要請。その後、自身も負傷し、事故前後の記憶を失った。</p><p>榊先生は管理責任を避けるため、鍵記録・展示当番・放送記録を改竄した。</p><p>事故直後の主人公は、記憶が失われる前に証拠を複数の場所へ残していた。</p><hr><p><b>ただし、一つだけ説明できない。</b></p><p>今日16:52、誰が『17:18。2年3組。』を送ったのか。</p><button class="choice primary" onclick="closeSheet();S.chapter=5;sv();go('rooftop')">管理端末を調べる</button>`)}

<script id="escape-layer-v2">

 if(S.chapter>=5 && !esc("exit")) return "脱出目標：最後の非常口を解除しよう。";
 return mysteryObjective();
}

}

 const c=(document.getElementById("exitCode").value||"").trim();
 if(c!=="1718"){toast("コードが違う。");return}
 if(!S.flags.finalReason){toast("偶然の入力では解除されない。");return}
 if(!S.flags.exitAuth){toast("管理端末認証がない。");return}
 if(!hasItem("ruler")){toast("非常レバーに手が届かない。");return}
 setEsc("exit");addLog("非常口の3段階ロックを解除。学校から脱出。");sv();
 sheet(`<h2>UNLOCK</h2><p>電子音。最後に、扉上部の非常レバーへ金属定規を引っ掛ける。</p>
 <p>——重い扉が、ゆっくり外側へ開いた。</p>
 <div class="dialog"><div class="name">自分</div>「……出られる。」</div>
 <button class="choice primary" onclick="endGame('true')">学校の外へ出る</button>`)
}

/* Item panel now communicates that items are physical escape tools. */
const basePanel=panel;
panel=function(type){
 if(type!=="items")return basePanel(type);
 sheet('<h2>持ち物</h2><p class="muted">鍵や道具は、扉・設備を調べたときに使用できます。</p>'+
 (S.items.length?S.items.map(x=>`<div class="item"><b>${x.name}</b>${x.desc}</div>`).join(""):"<p>何もない。</p>"))
}
</script>
