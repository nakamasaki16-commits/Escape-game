<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#070a0f">
<title>第零観測室 — 完全版</title>
<style>
:root{
  --bg:#070a0f; --panel:#101720; --panel2:#16212d; --line:#2a3a4d;
  --text:#edf5ff; --muted:#9aacbf; --cyan:#70d6ff; --amber:#ffd166;
  --green:#70e6a6; --red:#ff6b7a; --ink:#05070a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic",sans-serif}
body{min-height:100svh;overflow-x:hidden}
button,input{font:inherit}
button{touch-action:manipulation}
#app{max-width:760px;margin:auto;min-height:100svh;padding:env(safe-area-inset-top) 10px calc(82px + env(safe-area-inset-bottom))}
.topbar{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:8px;padding:8px 4px}
.iconbtn{width:44px;height:44px;border-radius:13px;border:1px solid var(--line);background:#111923;color:var(--text);display:grid;place-items:center;font-size:20px}
.brand{text-align:center}
.brand b{display:block;font-size:16px;letter-spacing:.12em}
.brand span{font-size:10px;color:var(--muted)}
.sceneWrap{position:relative;border:1px solid var(--line);border-radius:20px;overflow:hidden;background:#0b1017;box-shadow:0 18px 55px rgba(0,0,0,.38)}
#sceneSvg{width:100%;display:block;aspect-ratio:16/11;background:#080c12}
.sceneShade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,transparent 60%,rgba(2,4,7,.65))}
.roomTag{position:absolute;top:10px;left:10px;background:rgba(4,8,13,.82);border:1px solid #334457;border-radius:999px;padding:6px 9px;font-size:11px}
.chapterTag{position:absolute;top:10px;right:10px;background:rgba(4,8,13,.82);border:1px solid #334457;border-radius:999px;padding:6px 9px;font-size:11px;color:var(--amber)}
.hotspot{cursor:pointer}
.hotspot .hit{fill:rgba(112,214,255,0);stroke:rgba(112,214,255,0);stroke-width:2}
.hotspot:hover .hit,.hotspot.pulse .hit{stroke:rgba(112,214,255,.65);fill:rgba(112,214,255,.07)}
.pulse{animation:pulse 1.8s infinite}
@keyframes pulse{0%,100%{opacity:.75}50%{opacity:1}}
.navArrows{position:absolute;left:8px;right:8px;bottom:12px;display:flex;justify-content:space-between;pointer-events:none}
.navArrows button{pointer-events:auto;width:48px;height:48px;border-radius:50%;border:1px solid #3d536b;background:rgba(7,12,18,.84);color:white;font-size:21px}
.infoCard{margin-top:10px;background:linear-gradient(180deg,#111923,#0e141c);border:1px solid var(--line);border-radius:18px;padding:13px 14px}
.infoTitle{font-weight:800;font-size:17px;margin-bottom:5px}
.infoText{font-size:13px;line-height:1.72;color:#d8e2ee;white-space:pre-line}
.statusRow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-top:10px}
.status{padding:8px;border:1px solid var(--line);border-radius:11px;background:#0c1219;text-align:center}
.status b{display:block;font-size:13px}
.status span{font-size:10px;color:var(--muted)}
.bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(7,10,15,.45),rgba(7,10,15,.98) 25%)}
.bottominner{max-width:740px;margin:auto;display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.bottomnav button{border:1px solid var(--line);border-radius:14px;background:#101821;color:#cbd6e2;padding:8px 4px;min-height:52px;font-size:10px}
.bottomnav button i{display:block;font-style:normal;font-size:19px;margin-bottom:2px}
.bottomnav button.active{border-color:#3c7590;background:#153044;color:white}
.overlay{position:fixed;z-index:50;inset:0;background:rgba(0,0,0,.74);display:none;align-items:flex-end;justify-content:center}
.overlay.show{display:flex}
.sheet{width:min(760px,100%);max-height:88svh;overflow:auto;background:#0f161f;border:1px solid var(--line);border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -20px 60px rgba(0,0,0,.55)}
.sheet h2{margin:0 0 8px;font-size:19px}
.sheet p{line-height:1.7;color:#d7e1ec}
.close{float:right;border:1px solid var(--line);background:#151f2b;color:white;border-radius:11px;padding:8px 10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.choice{width:100%;padding:12px;border:1px solid var(--line);background:#15202c;color:white;border-radius:13px;margin:5px 0;text-align:left}
.choice.primary{border-color:#397693;background:#153548}
.choice.danger{border-color:#7a3440;background:#351921}
.inputrow{display:flex;gap:8px;margin-top:12px}
input{min-width:0;flex:1;background:#070b10;color:white;border:1px solid #34475b;border-radius:12px;padding:12px}
.bad{color:var(--red)} .good{color:var(--green)} .warn{color:var(--amber)}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--amber);letter-spacing:.06em}
.item,.clue,.logEntry{border:1px solid var(--line);border-radius:12px;background:#0b1118;padding:10px;margin:7px 0}
.item b,.clue b{display:block;margin-bottom:3px}
.item.selected{border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan) inset}
.muted{color:var(--muted);font-size:12px}
.tabs{display:flex;gap:6px;overflow:auto;margin-bottom:8px}
.tabs button{white-space:nowrap;border:1px solid var(--line);background:#111a24;color:#c6d2df;border-radius:999px;padding:8px 11px}
.tabs button.active{background:#173247;border-color:#40748f;color:white}
.hintBox{border-left:3px solid var(--amber);padding:8px 10px;background:#161a16;border-radius:8px;margin:8px 0}
.badge{display:inline-block;border:1px solid #40556c;border-radius:999px;padding:2px 7px;font-size:10px;color:#aebed0}
.puzzleBoard{background:#060a0e;border:1px solid #314155;border-radius:14px;padding:12px;margin:10px 0}
.switchrow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:7px 0;border-bottom:1px dashed #283648}
.switch{width:58px;height:30px;border-radius:999px;background:#263441;border:0;position:relative}
.switch:after{content:"";position:absolute;width:24px;height:24px;border-radius:50%;left:3px;top:3px;background:#99aabb;transition:.18s}
.switch.on{background:#236c55}
.switch.on:after{left:31px;background:#87efbb}
.mirrorGrid{display:grid;grid-template-columns:repeat(4,56px);gap:8px;justify-content:center;margin:12px 0}
.mirror{width:56px;height:56px;border-radius:11px;border:1px solid #3b4b5e;background:#0a1017;color:#bdeaff;font-size:28px}
.mirror.on{border-color:#69d4ff;background:#102a39}
.evidence{display:grid;grid-template-columns:1fr;gap:8px}
.evidence .choice{min-height:62px}
.center{text-align:center}
.endingTitle{font-size:28px;font-weight:900;letter-spacing:.08em;margin:12px 0}
.titleScreen{position:fixed;z-index:100;inset:0;background:#05070a;display:flex;align-items:center;justify-content:center;padding:20px}
.titleCard{width:min(650px,100%);border:1px solid #2a3848;border-radius:24px;overflow:hidden;background:#0b1016;box-shadow:0 30px 90px black}
.hero{height:300px;position:relative;background:
 radial-gradient(circle at 50% 46%,rgba(77,157,190,.22),transparent 23%),
 linear-gradient(180deg,#0c131b,#05070a)}
.hero svg{width:100%;height:100%}
.heroText{position:absolute;left:0;right:0;bottom:22px;text-align:center;text-shadow:0 3px 16px black}
.heroText h1{font-size:30px;letter-spacing:.14em;margin:0}
.heroText p{margin:6px 0 0;color:#aab8c7;font-size:12px}
.titleActions{padding:16px}
.titleActions button{width:100%;padding:13px;margin:5px 0;border:1px solid #33465a;border-radius:13px;background:#13202b;color:white}
.titleActions button.primary{background:#15384b;border-color:#397996}
.hidden{display:none!important}
.toast{position:fixed;z-index:80;left:50%;bottom:90px;transform:translateX(-50%);max-width:88vw;background:#111a23;border:1px solid #3b5067;border-radius:999px;padding:9px 14px;font-size:12px;box-shadow:0 10px 30px rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:.25s}
.toast.show{opacity:1}
@media (min-width:620px){
 .bottomnav{position:sticky;bottom:0;background:transparent;padding:10px 0}
 #app{padding-bottom:12px}
}
</style>
</head>
<body>

<div id="titleScreen" class="titleScreen">
  <div class="titleCard">
    <div class="hero">
      <svg viewBox="0 0 800 480" aria-hidden="true">
        <defs>
          <linearGradient id="g1" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#18222c"/><stop offset="1" stop-color="#05080b"/></linearGradient>
          <radialGradient id="glow"><stop stop-color="#7fdcff" stop-opacity=".55"/><stop offset="1" stop-color="#7fdcff" stop-opacity="0"/></radialGradient>
        </defs>
        <rect width="800" height="480" fill="url(#g1)"/>
        <rect x="70" y="85" width="660" height="300" rx="18" fill="#0b1117" stroke="#304355" stroke-width="5"/>
        <rect x="305" y="112" width="190" height="245" rx="8" fill="#06090c" stroke="#34495c" stroke-width="5"/>
        <rect x="329" y="145" width="142" height="55" rx="7" fill="#0e2634" stroke="#3e6b84"/>
        <circle cx="400" cy="172" r="90" fill="url(#glow)" opacity=".45"/>
        <path d="M111 366 L289 366 L289 326 L155 326 Z" fill="#101820" stroke="#273747"/>
        <rect x="116" y="317" width="92" height="42" rx="4" fill="#0d202b" stroke="#35617a"/>
        <path d="M522 135h160v80H522z" fill="#111a22" stroke="#35495d"/>
        <path d="M540 155h118M540 173h88M540 191h100" stroke="#668499" stroke-width="4" opacity=".45"/>
        <circle cx="400" cy="250" r="9" fill="#f0b84a"/>
      </svg>
      <div class="heroText"><h1>第零観測室</h1><p>THE ZERO OBSERVATION ROOM — COMPLETE EDITION</p></div>
    </div>
    <div class="titleActions">
      <button class="primary" onclick="newGame()">NEW GAME</button>
      <button id="continueBtn" onclick="continueGame()">CONTINUE</button>
      <button onclick="showPremise()">遊び方 / あらすじ</button>
    </div>
  </div>
</div>

<div id="app">
  <div class="topbar">
    <button class="iconbtn" onclick="openMenu()">☰</button>
    <div class="brand"><b>第零観測室</b><span id="chapterText">CHAPTER 0</span></div>
    <button class="iconbtn" onclick="toggleSound()" id="soundBtn">♪</button>
  </div>

  <div class="sceneWrap">
    <div id="roomTag" class="roomTag"></div>
    <div id="chapterTag" class="chapterTag"></div>
    <div id="sceneSvg"></div>
    <div class="sceneShade"></div>
    <div class="navArrows">
      <button id="leftBtn" onclick="moveDir(-1)">‹</button>
      <button id="rightBtn" onclick="moveDir(1)">›</button>
    </div>
  </div>

  <div class="infoCard">
    <div id="infoTitle" class="infoTitle"></div>
    <div id="infoText" class="infoText"></div>
    <div class="statusRow">
      <div class="status"><b id="progressStat">0/7</b><span>進行</span></div>
      <div class="status"><b id="clueStat">0</b><span>手掛かり</span></div>
      <div class="status"><b id="itemStat">0</b><span>所持品</span></div>
    </div>
  </div>
</div>

<div class="bottomnav">
 <div class="bottominner">
  <button onclick="openPanel('log')"><i>☷</i>ログ</button>
  <button onclick="openPanel('items')"><i>▣</i>アイテム</button>
  <button onclick="openPanel('clues')"><i>⌕</i>手掛かり</button>
  <button onclick="openPanel('map')"><i>⌂</i>マップ</button>
  <button onclick="openPanel('hint')"><i>?</i>ヒント</button>
 </div>
</div>

<div id="overlay" class="overlay"><div class="sheet"><button class="close" onclick="closeSheet()">閉じる</button><div id="sheetContent"></div></div></div>
<div id="toast" class="toast"></div>

<script>
const DEFAULT = {
 version:2, chapter:0, room:"observation", view:0, flags:{}, items:[], clues:[], logs:[],
 selectedItem:null, hint:{}, sound:true, ending:null
};
let S = JSON.parse(JSON.stringify(DEFAULT));
let audioCtx=null;

const ROOMS = {
 observation:{name:"第零観測室",views:4},
 corridor:{name:"研究区画・廊下",views:3},
 power:{name:"電源制御室",views:3},
 archive:{name:"記録保全室",views:3},
 optics:{name:"光学実験室",views:3},
 control:{name:"中央制御室",views:4},
 gate:{name:"最終隔離扉",views:1}
};

function save(){ localStorage.setItem("zeroRoomSaveV2",JSON.stringify(S)); updateUI(); }
function load(){ const x=localStorage.getItem("zeroRoomSaveV2"); if(x){try{S={...DEFAULT,...JSON.parse(x)};}catch(e){}} }
function newGame(){S=JSON.parse(JSON.stringify(DEFAULT)); addLog("目を覚ました。記憶が曖昧だ。"); save(); document.getElementById("titleScreen").classList.add("hidden"); render();}
function continueGame(){load(); document.getElementById("titleScreen").classList.add("hidden"); render();}
function resetGame(){ if(confirm("セーブデータを消して最初から始めますか？")){localStorage.removeItem("zeroRoomSaveV2");location.reload();}}
function showPremise(){showSheet(`<h2>第零観測室</h2><p>密閉された観測施設で目を覚ましたあなたは、自分が「被験者07」だと告げられる。しかし、施設内の記録には少しずつ矛盾がある。</p><p>画面内の物をタップして調査し、左右の矢印で視点移動。アイテムは「アイテム」から選択して使います。</p><p class="warn">すべての主要な謎は、その時点で入手可能な証拠だけで一意に解けるよう設計されています。</p>`);}
function closeSheet(){document.getElementById("overlay").classList.remove("show");}
function showSheet(html){document.getElementById("sheetContent").innerHTML=html;document.getElementById("overlay").classList.add("show");}
function toast(t){const el=document.getElementById("toast");el.textContent=t;el.classList.add("show");setTimeout(()=>el.classList.remove("show"),1700);}
function addLog(t){if(!S.logs.includes(t))S.logs.push(t);}
function addClue(id,name,desc){if(!S.clues.find(x=>x.id===id)){S.clues.push({id,name,desc});addLog("手掛かり「"+name+"」を記録した。");toast("手掛かり追加："+name);save();}}
function addItem(id,name,desc){if(!S.items.find(x=>x.id===id)){S.items.push({id,name,desc});addLog(name+"を入手した。");toast("入手："+name);save();}}
function hasItem(id){return !!S.items.find(x=>x.id===id)}
function hasClue(id){return !!S.clues.find(x=>x.id===id)}
function flag(k,v=true){S.flags[k]=v;save();}
function beep(freq=520,dur=.05){
 if(!S.sound)return;
 try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=freq;g.gain.value=.035;o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+dur);}catch(e){}
}
function toggleSound(){S.sound=!S.sound;document.getElementById("soundBtn").textContent=S.sound?"♪":"×";save();beep();}
function updateUI(){
 document.getElementById("chapterText").textContent="CHAPTER "+S.chapter;
 document.getElementById("chapterTag").textContent="CH."+S.chapter;
 document.getElementById("roomTag").textContent=ROOMS[S.room].name;
 document.getElementById("progressStat").textContent=S.chapter+"/7";
 document.getElementById("clueStat").textContent=S.clues.length;
 document.getElementById("itemStat").textContent=S.items.length;
 document.getElementById("soundBtn").textContent=S.sound?"♪":"×";
}
function setInfo(title,text){document.getElementById("infoTitle").textContent=title;document.getElementById("infoText").textContent=text;}
function moveDir(d){const n=ROOMS[S.room].views;S.view=(S.view+d+n)%n;save();render();}
function goRoom(r,v=0){if(!canEnter(r)){toast("まだ入れない。");return;}S.room=r;S.view=v;save();render();}
function canEnter(r){
 if(r==="observation"||r==="corridor")return true;
 if(r==="power")return S.chapter>=1;
 if(r==="archive")return S.chapter>=2;
 if(r==="optics")return S.chapter>=3;
 if(r==="control")return S.chapter>=4;
 if(r==="gate")return S.chapter>=6;
 return false;
}
function h(id,label,x,y,w,h,onclick,pulse=false){
 return `<g class="hotspot ${pulse?'pulse':''}" onclick="${onclick}"><rect class="hit" x="${x}" y="${y}" width="${w}" height="${h}" rx="9"/><text x="${x+w/2}" y="${y+h/2+5}" text-anchor="middle" fill="rgba(210,240,255,.0)" font-size="18">${label}</text></g>`;
}
function baseSvg(inner){
 return `<svg id="sceneArt" viewBox="0 0 800 550" xmlns="http://www.w3.org/2000/svg">
 <defs><linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#17212b"/><stop offset="1" stop-color="#080c10"/></linearGradient>
 <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#18222b"/><stop offset=".65" stop-color="#0b1016"/><stop offset="1" stop-color="#06090d"/></linearGradient>
 <radialGradient id="lamp"><stop stop-color="#9de4ff" stop-opacity=".55"/><stop offset="1" stop-color="#9de4ff" stop-opacity="0"/></radialGradient>
 </defs>${inner}</svg>`;
}
function roomShell(extra=""){
 return `<rect width="800" height="550" fill="url(#wall)"/>
 <polygon points="0,380 800,350 800,550 0,550" fill="url(#floor)"/>
 <path d="M0 380L800 350M140 550L220 370M330 550L360 365M515 550L500 362M700 550L640 356" stroke="#263645" stroke-width="2" opacity=".55"/>
 <rect x="90" y="42" width="620" height="22" rx="10" fill="#182633"/><rect x="280" y="47" width="240" height="12" rx="6" fill="#8edfff" opacity=".45"/>
 <ellipse cx="400" cy="65" rx="260" ry="120" fill="url(#lamp)" opacity=".18"/>${extra}`;
}

function render(){
 updateUI();
 const key=S.room+":"+S.view;
 let svg="",title="",text="";
 if(S.room==="observation"){
  if(S.view===0){
   svg=baseSvg(roomShell(`
    <rect x="300" y="115" width="200" height="245" rx="8" fill="#070a0e" stroke="#34495b" stroke-width="5"/>
    <rect x="325" y="148" width="150" height="58" rx="6" fill="#0e2634" stroke="#3d6680"/>
    <text x="400" y="182" text-anchor="middle" fill="#9bdcf5" font-size="19">LOCKED</text>
    <circle cx="465" cy="270" r="7" fill="#d2a540"/>
    ${h("door","door",295,108,215,262,"inspectDoor()",S.chapter===0)}
    <rect x="565" y="130" width="100" height="98" rx="8" fill="#101821" stroke="#3b4d60"/>
    <circle cx="615" cy="177" r="35" fill="#e5e6dd" stroke="#83909d" stroke-width="4"/>
    <path d="M615 177L615 150M615 177L638 186" stroke="#20252b" stroke-width="4"/>
    <text x="615" y="220" text-anchor="middle" fill="#9fb0c1" font-size="12">14:37</text>
    ${h("clock","clock",560,125,110,110,"inspectClock()",true)}
    <rect x="70" y="250" width="175" height="110" rx="6" fill="#111923" stroke="#314458"/>
    <rect x="88" y="266" width="115" height="55" rx="4" fill="#102b3a" stroke="#3b6d89"/>
    <text x="145" y="298" text-anchor="middle" fill="#9ee2ff" font-size="15">15:12:08</text>
    ${h("terminal","terminal",65,245,190,122,"inspectTerminal()",true)}
   `));
   title="観測室・正面"; text="正面扉、壁掛け時計、時刻端末。扉の第一認証が起動している。";
  }else if(S.view===1){
   svg=baseSvg(roomShell(`
    <rect x="80" y="225" width="470" height="160" rx="9" fill="#111923" stroke="#304357"/>
    <rect x="105" y="195" width="180" height="110" rx="6" fill="#0b1219" stroke="#32485d"/>
    <path d="M125 225h135M125 245h115M125 265h128" stroke="#8095aa" stroke-width="5" opacity=".45"/>
    ${h("note","note",100,190,190,120,"inspectSyncNote()",true)}
    <rect x="405" y="185" width="120" height="105" rx="8" fill="#0d151d" stroke="#42556a"/>
    <path d="M430 220h70M430 242h70M430 264h45" stroke="#7ea4b9" stroke-width="4" opacity=".5"/>
    ${h("drawer","drawer",390,175,150,125,"inspectDrawer()")}
   `));
   title="観測室・机"; text="机の上に保守ノート。右には鍵付き引き出し。";
  }else if(S.view===2){
   svg=baseSvg(roomShell(`
    <rect x="170" y="155" width="220" height="210" rx="9" fill="#0f171f" stroke="#34495c"/>
    <rect x="195" y="180" width="170" height="120" rx="6" fill="#071018" stroke="#41657b"/>
    <text x="280" y="220" text-anchor="middle" fill="#82d9ff" font-size="15">OBS-0</text>
    <text x="280" y="248" text-anchor="middle" fill="#8ba4b6" font-size="12">RECOVERY REQUIRED</text>
    ${h("pc","pc",160,145,240,230,"inspectPC()")}
    <rect x="500" y="130" width="155" height="245" rx="8" fill="#0c1219" stroke="#34495c"/>
    <circle cx="580" cy="200" r="32" fill="#111e27" stroke="#3b5a6f"/>
    <path d="M580 200L626 154" stroke="#647889" stroke-width="8"/>
    <text x="577" y="310" text-anchor="middle" fill="#8fa2b5" font-size="12">CAM-3</text>
    ${h("cam","cam",490,120,175,270,"inspectCamera()")}
   `));
   title="観測室・PC"; text="復旧待ちの端末と、天井へ向いた監視カメラ。";
  }else{

function powerPuzzle(){
 const vals=[3,5,7,11], names=["A","B","C","D"];
 if(!S.flags.pwr)S.flags.pwr=[false,false,false,false];
 const p=S.flags.pwr;
 let rows=names.map((n,i)=>`<div class="switchrow"><div><b>LINE ${n}</b> <span class="muted">${vals[i].toFixed(1)}</span></div><button class="switch ${p[i]?'on':''}" onclick="togglePwr(${i})"></button></div>`).join("");
 const total=p.reduce((a,v,i)=>a+(v?vals[i]:0),0);
 showSheet(`<h2>非常電源復旧</h2><p>規程を満たし、主母線を16.0にする。</p><div class="puzzleBoard">${rows}<p>現在値：<span class="code">${total.toFixed(1)}</span></p></div><button class="choice primary" onclick="checkPower()">投入する</button>`);
}
function togglePwr(i){if(!S.flags.pwr)S.flags.pwr=[false,false,false,false];S.flags.pwr[i]=!S.flags.pwr[i];powerPuzzle();}
function checkPower(){
 const p=S.flags.pwr||[], vals=[3,5,7,11],total=p.reduce((a,v,i)=>a+(v?vals[i]:0),0);
 const ok=Math.abs(total-16)<.01 && !p[2] && !(p[2]&&p[3]);
 if(!ok){beep(170,.12);toast("安全規程を満たしていない。");return;}
 closeSheet();S.chapter=Math.max(S.chapter,2);flag("powerRestored");addLog("中央制御系の非常電源を復旧した。");addItem("fusekey","ヒューズ型データキー","配電盤から排出された保守用データキー。");render();
}

}
function inspectBadgeServer(){

}
function archivePuzzle(){
 if(!hasItem("usb")){showSheet("<h2>監査端末</h2><p>復旧USBが必要。</p>");return;}
 showSheet(`<h2>監査ログの矛盾</h2><p>次のうち、設備記録と物理的に両立しないものを選べ。</p>
 <button class="choice" onclick="answerArchive('A')"><b>A</b> 14:37:02　Badge server：SUBJECT-07 入室</button>
 <button class="choice" onclick="answerArchive('B')"><b>B</b> 14:37:05　CAM-3：SUBJECT-07の顔を映像認証</button>
 <button class="choice" onclick="answerArchive('C')"><b>C</b> 14:42:31　PC：SUBJECT-07資格情報でログイン</button>`);
}
function answerArchive(a){
 if(a!=="B"){beep(170,.12);toast("その記録は他の証拠と両立する。");return;}
 if(!hasClue("camlog")){toast("設備記録を確認した方がいい。");return;}
 closeSheet();S.chapter=Math.max(S.chapter,3);addClue("forgedvideo","存在しない入室映像","CAM-3停止後の14:37映像認証ログは偽造。");addLog("監査端末が記録Bを改竄データと判定した。");addItem("archiveToken","監査トークン","改竄記録を確定したことで発行された署名トークン。");save();render();
}
function inspectArchiveDrawer(){
 if(!(hasItem("fusekey")&&hasItem("archiveToken"))){showSheet("<h2>A-07保管庫</h2><p>二要素認証：保守データキー＋監査トークン。</p>");return;}
 addItem("lens","位相プレート","A-07保管庫に封印されていた光学部品。");
 addClue("Bphoto","研究員Bの写真断片","保管庫の紙資料。顔写真の右半分だけが残る。胸元に『B』のバッジ。");
 showSheet("<h2>A-07保管庫</h2><p>二要素認証が通った。位相プレートと、破れた職員写真を回収した。</p>");
}

// CH3
function inspectOpticsRule(){
 addClue("opticsrule","セキュリティ光路条件","キー生成には3枚すべてのミラーで反射し、最終光が右側受光器へ到達する必要がある。");
 showSheet("<h2>光路校正規則</h2><p>通常校正は2反射。セキュリティキーは<span class='warn'>3枚すべて</span>を使用し、右側受光器へ到達させる。</p>");
}
function opticsPuzzle(){
 if(!hasItem("lens")){showSheet("<h2>遅延ライン</h2><p>中央ソケットに位相プレートが欠けている。</p>");return;}
 if(!S.flags.mirrors)S.flags.mirrors=[0,0,0];
 const m=S.flags.mirrors;
 showSheet(`<h2>光学キー生成</h2><p>各ミラーをタップして「／」「＼」を切り替える。3枚すべてで反射し、右側受光器へ導け。</p>
 <div class="mirrorGrid">
 <button class="mirror" onclick="rotM(0)">${m[0]?"＼":"／"}</button>
 <button class="mirror" onclick="rotM(1)">${m[1]?"＼":"／"}</button>
 <button class="mirror" onclick="rotM(2)">${m[2]?"＼":"／"}</button>
 </div>
 <div class="puzzleBoard"><div id="beamDiagram">${beamText()}</div></div>
 <button class="choice primary" onclick="checkOptics()">照射テスト</button>`);
}
function rotM(i){S.flags.mirrors[i]=1-S.flags.mirrors[i];opticsPuzzle();}
function beamText(){
 const m=S.flags.mirrors||[0,0,0];
 const chars=m.map(x=>x?"＼":"／").join("　");
 return `<div class="center code">LASER → ${chars} → SENSOR</div><p class="muted center">正しい組合せでは、3枚すべてで光路が折り返される。</p>`;
}
function checkOptics(){
 const m=S.flags.mirrors||[];
 // Solution deliberately unique: / \ /
 if(m.join("")!=="010"){beep(190,.1);toast("受光器に届かない。");return;}
 closeSheet();S.chapter=Math.max(S.chapter,4);addItem("opticalKey","ワンタイム光学キー","中央制御端末の暗号領域を15分間だけ解除できる。");addLog("3反射のセキュリティ光路を成立させた。");save();render();
}
function inspectKeyGen(){showSheet("<h2>光学キー生成器</h2><p>"+(hasItem("opticalKey")?"緑色に点灯している。キーは生成済み。":"遅延ラインの正しい光路待ち。")+"</p>");}

// CH4
function inspectEvidencePolicy(){
 addClue("evidencePolicy","証拠優先順位","署名付き機械ログ > 独立物理センサ > 人間の報告 > 再構成映像・記憶。");
 showSheet("<h2>証拠の優先順位</h2><p>1. 暗号署名付き機械ログ<br>2. 独立した物理センサ記録<br>3. 人間が記述した報告<br>4. 再構成映像・記憶データ</p>");
}
function inspectProjectFile(){
 if(!hasItem("opticalKey")){showSheet("<h2>ZERO計画資料</h2><p>暗号化。ワンタイム光学キーが必要。</p>");return;}
 addClue("zeropurpose","ZERO計画の目的","OBS-0だけに記憶上書き系があり、観測対象の自己認識を改変する実験。");
 showSheet("<h2>ZERO計画 / 機密資料</h2><p>「観測は対象を記録するだけではない。対象が何を真実だと信じるかを変更する。」</p><p>Memory rewrite subsystem: <span class='warn'>OBS-0 ONLY</span></p>");
}
function controlPuzzle(){
 if(!S.flags.powerRestored){showSheet("<h2>主端末</h2><p>非常電源が不足している。</p>");return;}
 if(!hasItem("opticalKey")){showSheet("<h2>主端末</h2><p>暗号領域の解除に光学キーが必要。</p>");return;}
 showSheet(`<h2>観測者記録の信頼性</h2><p>どの記録を最も低信頼として隔離すべきか。証拠規程に従え。</p>
 <button class="choice" onclick="answerControl('A')"><b>A：認証サーバ</b><br>14:37 SUBJECT-07 badge accepted / signed</button>
 <button class="choice" onclick="answerControl('B')"><b>B：研究員報告</b><br>「映像で07本人を確認した」</button>
 <button class="choice" onclick="answerControl('C')"><b>C：生体センサ</b><br>14:40 room occupied / heartbeat detected</button>
 <button class="choice" onclick="answerControl('D')"><b>D：復元記憶</b><br>「私は被験者07である」</button>`);
}
function answerControl(a){
 if(a!=="D"){beep(180,.1);toast("より低い信頼階層が残っている。");return;}
 if(!(hasClue("evidencePolicy")&&hasClue("zeropurpose"))){toast("証拠規程とZERO計画資料を確認しよう。");return;}
 closeSheet();S.chapter=Math.max(S.chapter,5);
 addClue("memoryUntrusted","自己記憶は証拠にならない","OBS-0では記憶上書きが可能。『自分は07だ』という記憶は最低信頼。");
 addLog("主端末が自己記憶データを隔離。本人性判定が再開された。");
 addItem("identityShard","身元キー断片","研究員データベース照合に必要な暗号断片。");
 save();render();
}

// CH5
function prepareFinal(){
 if(S.chapter<5){showSheet("<h2>隔離扉制御</h2><p>本人性判定が終わっていない。</p>");return;}
 if(!hasItem("identityShard"))return;
 showSheet(`<h2>身元照合</h2><p>研究員Bの写真断片と、現在の顔認証結果を照合する。</p>
 <div class="puzzleBoard"><p>顔認証：<span class="code">B = 98.7%</span></p><p>被験者07：顔テンプレート <span class="bad">未登録</span></p></div>

 <button class="choice primary" onclick="identityReason()">理由を推理する</button>`);
}
function identityReason(){
 showSheet(`<h2>なぜ研究員BはSUBJECT-07で入室した？</h2>
 <button class="choice" onclick="answerIdentity('a')">自分が07だと思い込んでいたから</button>
 <button class="choice" onclick="answerIdentity('b')">被験者07を装い、OBS-0へ侵入するため</button>
 <button class="choice" onclick="answerIdentity('c')">認証サーバが故障していたから</button>`);
}
function answerIdentity(a){
 if(a!=="b"){beep(170,.12);toast("既存の署名ログと矛盾する。");return;}
 closeSheet();S.chapter=6;
 addClue("identityB","あなたは研究員B","Bは被験者07資格情報でOBS-0へ侵入。その後、記憶上書きを受けて自身を07と思い込んだ。");
 addLog("本人性判定：RESEARCHER-B。最終隔離扉が解錠準備に入った。");
 addItem("finalKey","最終認証キー","監査・光学・本人性の3系統認証を統合した鍵。");
 save();goRoom("gate",0);
}

// CH6-7 endings
function finalDecision(){
 if(!hasItem("finalKey")){showSheet("<h2>最終隔離扉</h2><p>認証キーが不足。</p>");return;}
 showSheet(`<h2>最後の選択</h2><p>中央制御系は3つの処理を提示している。</p>
 <button class="choice primary" onclick="ending('true')"><b>監査ログを外部へ送信し、ZERO計画を停止</b><br><span class="muted">改竄記録、OBS-0記憶処理、研究員Bの侵入記録を公開する。</span></button>
 <button class="choice" onclick="ending('normal')"><b>身元だけ復旧して施設を退出</b><br><span class="muted">証拠は施設内に残す。</span></button>
 <button class="choice danger" onclick="ending('bad')"><b>OBS-0を再起動して記憶を初期化</b></button>`);
}
function ending(type){
 S.chapter=7;S.ending=type;save();beep(type==="true"?880:220,.22);
 if(type==="true"){
  showSheet(`<div class="center"><div class="endingTitle good">TRUE END</div><h2>観測者は、観測されるまで存在しない</h2>
  <p>あなたは研究員Bだった。ZERO計画の危険性に気づき、被験者07の資格情報を使ってOBS-0へ侵入した。</p>
  <p>施設側は侵入者を“被験者”として処理し、記憶を書き換えた。偽造された監視映像は、その処理が正当だったことにするための後付けだった。</p>
  <p>しかし署名付き時刻、設備障害、物理保管庫、光学キー——互いに独立した証拠だけは、改竄された物語に完全には従わなかった。</p>
  <p class="warn">あなたは証拠一式を外部へ送信し、ZERO計画を停止する。</p><hr><p>扉が開く。外の空気は冷たい。</p>
  <button class="choice primary" onclick="resetGame()">最初から</button></div>`);
 }else if(type==="normal"){
  showSheet(`<div class="center"><div class="endingTitle">NORMAL END</div><h2>退出</h2><p>研究員Bとしての身元だけを復旧し、施設を出た。</p><p>翌朝、ZERO計画のサーバは遠隔から初期化された。あなたの手元には、何も証明できるものが残っていない。</p><p class="code">CASE STATUS: UNRESOLVED</p><button class="choice" onclick="resetGame()">最初から</button></div>`);
 }else{
  showSheet(`<div class="center"><div class="endingTitle bad">BAD END</div><h2>第零観測室</h2><p>OBS-0を再起動した。</p><p>「観測者B。記憶初期化を開始します。」</p><p>視界が白くなる。</p><hr><p>次に目を覚ました時、壁掛け時計は14:37を示していた。</p><button class="choice danger" onclick="resetGame()">最初から</button></div>`);
 }
}

// miscellaneous
function inspectDirectory(){showSheet("<h2>施設案内</h2><p>OBS-0：西<br>POWER：中央<br>ARCHIVE：中央<br>OPTICS：東<br>CONTROL：中央奥</p>");}
function openMenu(){showSheet(`<h2>メニュー</h2><button class="choice" onclick="closeSheet()">ゲームに戻る</button><button class="choice" onclick="showPremise()">遊び方</button><button class="choice danger" onclick="resetGame()">セーブ削除 / 最初から</button><p class="muted">進行状況はこのブラウザのLocalStorageに自動保存されます。</p>`);}
function openPanel(type){
 if(type==="items"){
  let html="<h2>アイテム</h2>"+(S.items.length?S.items.map(x=>`<button class="choice ${S.selectedItem===x.id?'primary':''}" onclick="selectItem('${x.id}')"><b>${x.name}</b><br><span class="muted">${x.desc}</span></button>`).join(""):"<p>まだ何も持っていない。</p>");
  html+=S.selectedItem?`<p class="good">選択中：${S.items.find(x=>x.id===S.selectedItem)?.name}</p>`:"<p class='muted'>アイテムを選ぶと、必要な場所で自動的に使用されます。</p>";
  showSheet(html);
 }else if(type==="clues"){
  showSheet("<h2>手掛かり</h2>"+(S.clues.length?S.clues.map(x=>`<div class="clue"><b>${x.name}</b><span>${x.desc}</span></div>`).join(""):"<p>まだ手掛かりはない。</p>"));
 }else if(type==="log"){
  showSheet("<h2>行動ログ</h2>"+(S.logs.length?S.logs.slice().reverse().map(x=>`<div class="logEntry">${x}</div>`).join(""):"<p>ログはない。</p>"));
 }else if(type==="map"){
  let rooms=Object.keys(ROOMS).map(r=>`<button class="choice ${S.room===r?'primary':''}" ${canEnter(r)?"":"disabled"} onclick="closeSheet();goRoom('${r}',0)">${ROOMS[r].name}${canEnter(r)?"":" <span class='muted'>LOCKED</span>"}</button>`).join("");
  showSheet("<h2>施設マップ</h2>"+rooms);
 }else{
  const hl=S.hint[S.chapter]||0;
  showSheet(`<h2>ヒント</h2><div class="hintBox">${hintText(S.chapter,hl)}</div><button class="choice" onclick="moreHint()">もう少しヒント</button>`);
 }
}
function selectItem(id){S.selectedItem=S.selectedItem===id?null:id;save();openPanel("items");}
function moreHint(){S.hint[S.chapter]=(S.hint[S.chapter]||0)+1;save();openPanel("hint");}
function hintText(ch,l){
 const H={
 0:["時計だけでは断定できない。『正しい現在時刻』と『時計の正常時の挙動』を別々に確認しよう。","保守端末の署名付き時刻と、机の同期規程を調べる。","正常なTS-4は3分同期できなければ消灯する。15:12なのに14:37で点灯している壁時計は仕様と両立しない。"],
 1:["目標値だけでなく、安全規程による禁止条件がある。","Cは使えない。残りA=3、B=5、D=11で16になる組合せを探す。","B+D = 5+11 = 16。"],
 2:["映像ログが存在することと、その時刻にカメラが映像を作れたことは別。","CAM-3の設備障害ログを見る。","14:01以降映像ストリームは失われているので、14:37の顔認証映像は成立しない。"],
 3:["セキュリティ光路は3枚すべてを使う。","3枚の向きは左右対称になる。","左から ／ ＼ ／。"],
 4:["『どれが正しいか』ではなく『最も低信頼か』。施設の証拠規程が鍵。","再構成された記憶は最下位。しかもOBS-0には記憶上書き機能がある。","『私は被験者07』という自己記憶を隔離する。"],
 5:["顔認証だけでは侵入理由は説明できない。署名付きbadgeログは正常だった。","研究員Bが意図的に07の資格情報を使ったと考えると、すべてが繋がる。","BはZERO計画を止めるため被験者07を装って侵入し、その後記憶を書き換えられた。"],
 6:["ここからは正解というより選択。ただし証拠を外へ残さないと、施設側が物語を再び書き換えられる。","TRUE ENDは証拠公開＋計画停止。"]
 };
 const arr=H[ch]||["これまでの手掛かりを整理しよう。"];return arr[Math.min(l,arr.length-1)];
}

load();
document.getElementById("continueBtn").disabled=!localStorage.getItem("zeroRoomSaveV2");
if(localStorage.getItem("zeroRoomSaveV2")) render();
</script>
