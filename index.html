<script>
const BASE={chapter:0,room:'classroom',view:0,flags:{},items:[],clues:[],logs:[],hint:{},ending:null};let S=JSON.parse(JSON.stringify(BASE));
const rooms={classroom:{name:'2年3組',views:4,pos:[2,4]},hall:{name:'2階廊下',views:4,pos:[2,3]},staff:{name:'職員室',views:4,pos:[1,3]},science:{name:'理科室',views:4,pos:[3,3]},broadcast:{name:'放送室',views:4,pos:[2,2]},old:{name:'旧校舎階段',views:4,pos:[2,1]},rooftop:{name:'屋上前',views:2,pos:[2,0]}};
function sv(){localStorage.setItem('schoolEscapePremiumStableV2',JSON.stringify(S));ui()}function ld(){let x=localStorage.getItem('schoolEscapePremiumStableV2');if(x)try{S={...BASE,...JSON.parse(x)}}catch(e){}}
function startGame(){S=JSON.parse(JSON.stringify(BASE));localStorage.removeItem('schoolEscapePremiumStableV2');document.getElementById('prologue').classList.add('hidden');introSequence()}function continueGame(){ld();document.getElementById('prologue').classList.add('hidden');render()}
function showIntro(){sheet(`<h2>あらすじ</h2><p>放課後の教室で目を覚ましたあなた。完全下校時刻はとうに過ぎ、校舎には人の気配がない。なぜ自分だけがここにいるのか——身近な記録を辿って学校から脱出する。</p><p>スマホ、黒板、鍵当番表、放送記録——身近なものを調べながら、なぜ自分だけが学校に残っているのかを追う。</p><p class="muted">左右で4面の壁を見回し、気になる物をタップ。重要な謎はその時点で得られる証拠だけで解けます。</p>`)}
function introSequence(){sheet(`<div class="dialog"><div class="name">？？？</div>……寒い。</div><p>机に突っ伏していたらしい。蛍光灯は半分消え、窓の外はもう暗い。</p><div class="dialog"><div class="name">自分</div>「……寝てた？」</div><p>スマホを手に取る。時刻は18:42。通知はない。</p><div class="dialog"><div class="name">自分</div>「みんな、帰ったのか……？」</div><button class="choice primary" onclick="closeSheet();addItem('phone','スマートフォン','18:42。圏外。バッテリー31%。');addLog('18:42、2年3組の教室で目を覚ました。');sv();render()">起き上がる</button>`)}
function closeSheet(){document.getElementById('overlay').classList.remove('show')}function sheet(h){document.getElementById('sheet').innerHTML=h;document.getElementById('overlay').classList.add('show')}function toast(t){let e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1500)}function addLog(t){if(!S.logs.includes(t))S.logs.push(t)}function addItem(id,name,desc){if(!S.items.find(x=>x.id===id)){S.items.push({id,name,desc});toast('入手：'+name)}}function addClue(id,name,desc){if(!S.clues.find(x=>x.id===id)){S.clues.push({id,name,desc});addLog('手掛かり「'+name+'」');toast('手掛かり追加：'+name)}}function hasClue(id){return !!S.clues.find(x=>x.id===id)}function hasItem(id){return !!S.items.find(x=>x.id===id)}function turn(d){S.view=(S.view+d+rooms[S.room].views)%rooms[S.room].views;sv();render()}function can(r){if(r==='classroom'||r==='hall')return true;if(r==='staff')return S.chapter>=1;if(r==='science')return S.chapter>=2&&hasItem('staffKey');if(r==='broadcast')return S.chapter>=3&&hasItem('keyTag');if(r==='old')return S.chapter>=4;if(r==='rooftop')return S.chapter>=5;return false}function go(r){if(!can(r)){toast('まだ入れない。');return}S.room=r;S.view=0;sv();render()}
function ui(){document.getElementById('chapTxt').textContent='CHAPTER '+S.chapter;document.getElementById('chapter').textContent='CH.'+S.chapter;document.getElementById('where').textContent=rooms[S.room].name;document.getElementById('wall').textContent='壁 '+(S.view+1)+'/'+rooms[S.room].views;renderMap()}
function renderMap(){
  let cells=[];
  for(let y=0;y<5;y++){
    for(let x=0;x<5;x++){
      const r=Object.keys(rooms).find(k=>rooms[k].pos[0]===x&&rooms[k].pos[1]===y);
      if(!r){
        cells.push('<div class="mapcell"></div>');
        continue;
      }
      const unlocked=can(r), here=S.room===r;
      const click = unlocked && !here ? `onclick="go('${r}')"` : "";
      const role = unlocked ? 'role="button"' : '';
      const extra = unlocked && !here ? ' tappable' : '';
      cells.push(
        `<div class="mapcell ${unlocked?'open':''} ${here?'here':''}${extra}" ${click} ${role}>`+
        `${unlocked?rooms[r].name:"？"}${here?'<span class="arrow">▲</span>':''}</div>`
      );
    }
  }
  document.getElementById("map").innerHTML=cells.join("");
}

function currentObjective(){
  if(S.chapter===0){
    if(!hc("pc") || !hc("clock")) return "教室に残された違和感を調べよう。";
    return "教室の外へ出て、今日の自分の記録を確かめよう。";
  }
  if(S.chapter===1){
    if(!hc("entry") || !hc("absence")) return "今日、自分が学校にいたことになっているのか確かめよう。";
    return "次の手掛かりを探すため、特別教室を調べよう。";
  }
  if(S.chapter===2){
    if(!hc("diagram")) return "理科室に残された文化祭展示を調べよう。";
    if(!hc("hidden")) return "展示装置を動かして、残された手掛かりを探そう。";
    return "17:18に関係する記録を探しに行こう。";
  }
  if(S.chapter===3){
    if(!hc("recorder")) return "放送室で、去年の文化祭前日の記録を探そう。";
    if(!hc("1718")) return "壊れた録音の時系列を復元しよう。";
    return "17:18に何が起きたのか、現場を確かめよう。";
  }
  if(S.chapter===4){
    if(!hc("warning") || !hc("repair")) return "旧校舎で、事故の前から危険が知られていたか確かめよう。";
    if(!hc("uvnote")) return "旧校舎に残された、自分自身の痕跡を探そう。";
    return "集めた証拠から、去年の事件全体を組み立てよう。";
  }
  if(S.chapter===5){
    return "推理ボードで、誰が何を知り、何をしたのか整理しよう。";
  }
  if(S.chapter===6){
    if(!hc("msglog")) return "最後に残った謎――今日の匿名メッセージを調べよう。";
    return "事件の記録をどう扱うか決めよう。";
  }
  return "ここまでの証拠を見直そう。";
}

function noticeBoard(){addClue('festival','文化祭準備の掲示','放送委員と理科部が共同展示「声と光の迷路」を準備していた。');sheet('<h2>掲示板</h2><p>文化祭準備の紙。</p><p>放送委員 × 理科部<br>共同展示「声と光の迷路」</p>')}function lostFound(){sheet('<h2>落とし物箱</h2><p>水筒、ハンカチ、片方だけの上履き。特に使えそうな物はない。</p>')}function staffPC(){addClue('login','職員PCのログ','18:06、校内放送システムに「2-3」の端末から接続。');sheet(`<h2>職員PC</h2><p>画面には直前のシステムログ。</p><p class="code">18:06　Broadcast system login<br>Source: CLASSROOM 2-3</p><div class="dialog"><div class="name">自分</div>「18:06……。」</div>`)}function keyBoard(){if(!S.items.find(x=>x.id==='staffKey'))addItem('staffKey','特別教室キー','鍵棚に「理科室」の予備キーが残っていた。');sheet('<h2>鍵棚</h2><p>理科室の予備キーを取った。</p>')}function attendance(){addClue('attendance','今日の出席簿','あなたの名前は「欠席」。理由欄は空白。');sheet(`<h2>出席簿</h2><p>今日の日付。</p><p>自分の名前の横に——<span class="badtext"><span class="important">欠席</span></span>。</p><div class="dialog"><div class="name">自分</div>「……は？」</div><p class="muted">理由欄は空白。</p>${S.chapter===1?'<button class="choice primary" onclick="advanceCh2()">出席簿を閉じる</button>':''}`);if(S.chapter===1){addLog('出席簿では自分は今日欠席扱い。');sv()}}function advanceCh2(){closeSheet();S.chapter=2;sv();sheet(`<h2>CHAPTER 2　今日、俺は欠席している</h2><p>教室で目を覚ました。けれど学校の記録では、自分は今日ここへ来ていない。</p><div class="dialog"><div class="name">自分</div>「……もう少し調べよう。」</div><button class="choice primary" onclick="closeSheet();render()">続ける</button>`)}
function scienceMemo(){addClue('mirrorHint','文化祭準備メモ','鏡3枚セット。順番は「左・右・左」。');sheet(`<h2>文化祭準備メモ</h2><p>「声と光の迷路」用。</p><p class="code">鏡：左 → 右 → 左</p>`)}function scienceCabinet(){addItem('uvPen','UVペン','準備棚に残っていた文化祭用の紫外線ペン。');sheet('<h2>準備室棚</h2><p>文化祭用のUVペンが一本残っている。</p>')}function laserPuzzle(){if(!hasClue('mirrorHint')){sheet('<h2>光学実験台</h2><p>鏡3枚の向きを変えられる。どこかに手順があるはず。</p>');return}sheet(`<h2>光学実験</h2><p>文化祭展示の再現用。メモ通りに鏡を並べる。</p><button class="choice" onclick="laserAns('LRL')">左 → 右 → 左</button><button class="choice" onclick="laserAns('RLR')">右 → 左 → 右</button><button class="choice" onclick="laserAns('LLR')">左 → 左 → 右</button>`)}function laserAns(a){if(a!=='LRL'){toast('受光器が反応しない。');return}closeSheet();addItem('cassette','小型ICレコーダー','受光器の隠しケースから出てきた。ラベルは「文化祭前日」。');S.chapter=3;addLog('理科室の展示装置から古い録音機を発見。');sv();sheet(`<h2>CHAPTER 3　文化祭前日の録音</h2><p>理科室の展示装置から、去年の日付が書かれた録音機が出てきた。</p><div class="dialog"><div class="name">自分</div>「放送室なら再生できるかも。」</div><button class="choice primary" onclick="closeSheet();render()">続ける</button>`)}
function broadcastSchedule(){addClue('broadcastDuty','放送委員当番表','文化祭前日17:40〜18:10の担当欄だけ、名前が黒く塗り潰されている。');sheet('<h2>放送当番表</h2><p>文化祭前日の担当欄。</p><p class="code">17:40–18:10　██████</p>')}function oldRecording(){if(!S.items.find(x=>x.id==='cassette')){sheet('<h2>古い録音棚</h2><p>棚は空いている。何か持ち出された跡がある。</p>');return}addClue('voice','文化祭前日の録音','18:04「まだ一人、2年3組に残ってる」／18:05「誰？」「……名前が出てこない」');sheet(`<h2>古い録音</h2><p class="code">18:04</p><p>『先生、まだ一人、2年3組に残ってます。』</p><p class="code">18:05</p><p>『誰？』<br>『……名前が出てこない。』</p><div class="dialog"><div class="name">自分</div>「……。」</div>`)}function audioLog(){if(!hasClue('voice')){sheet('<h2>放送記録</h2><p>新しい録音しか残っていない。古いデータは別媒体に移されている。</p>');return}addClue('todayAudio','今日の18:06録音','18:06、2年3組のマイクが30秒だけON。人の声はなく、机を引く音だけ。');sheet(`<h2>今日の放送ログ</h2><p class="code">18:06　MIC: CLASSROOM 2-3</p><p>机を引くような音。人の声はない。</p><div class="dialog"><div class="name">自分</div>「……18:06。」</div>`);if(S.chapter===3){S.chapter=4;sv();setTimeout(()=>sheet(`<h2>CHAPTER 4　去年と今日</h2><p>去年の録音と、今日の18:06。二つの記録が同じ教室を指している。</p><div class="dialog"><div class="name">自分</div>「……まだ足りない。」</div><button class="choice primary" onclick="closeSheet();render()">続ける</button>`),50)}}
function timeCapsuleNote(){addClue('capsule','卒業制作の掲示','「忘れたくないことを一つだけ、旧校舎ロッカーへ」。去年の文化祭企画。');sheet('<h2>古い掲示</h2><p>「忘れたくないことを一つだけ、旧校舎ロッカーへ。」</p>')}function oldStairs(){sheet('<h2>旧校舎階段</h2><p>足跡が一組だけ、新しい。</p><div class="dialog"><div class="name">自分</div>「……見覚えのある模様だ。」</div>')}function oldLocker(){if(!S.items.find(x=>x.id==='uvPen')){sheet('<h2>古いロッカー</h2><p>扉の内側に薄い線。普通の光では読めない。</p>');return}addClue('letter','UVで浮かんだ手紙','「もしまた忘れてここに来たら、放送室の録音を聞け。君は悪くない。あの日、助けを呼んだのは君だ。」');sheet(`<h2>UVで浮かぶ文字</h2><p>ロッカーの内側に文字が浮かぶ。</p><p>『もしまた忘れてここに来たら、放送室の録音を聞け。君は悪くない。あの日、助けを呼んだのは君だ。』</p><div class="dialog"><div class="name">自分</div>「……“また”？」</div>`)}function roofDoor(){if(!hasClue('letter')){sheet('<h2>屋上前の扉</h2><p>開かない。ロッカーを調べる必要がありそうだ。</p>');return}S.chapter=5;addLog('旧校舎ロッカーの手紙を読んだ。屋上前へ。');sv();go('rooftop')}
function networkTerminal(){addClue('network','校内ネットワーク端末','去年の文化祭前日の記録一式を外部へ送信可能。校内から削除することもできる。');sheet('<h2>ネットワーク端末</h2><p>去年の記録はまだ校内サーバに残っている。</p><p>外部送信／削除、どちらも可能。</p>')}function finalChoice(){sheet(`<h2>最後の選択</h2><p>手紙、録音、出席簿、今日のログ。全部をここで終わらせることも、外へ残すこともできる。</p><button class="choice primary" ${hasClue('network')?'':'disabled'} onclick="endGame('true')">記録を外部へ送信して、先生に連絡する</button><p class="muted">${hasClue('network')?'':'※外部送信手段をまだ確認していない。'}</p><button class="choice" onclick="endGame('normal')">自分だけ校舎を出る</button><button class="choice bad" onclick="endGame('bad')">去年の記録を全部削除する</button>`)}function endGame(t){S.ending=t;S.chapter=6;sv();if(t==='true')sheet(`<div class="titleline good">TRUE END</div><p>屋上前の端末から記録を送信した。</p><p>数分後、スマホに圏外表示が消える。</p><div class="dialog"><div class="name">担任</div>『今どこにいる？　学校か？』</div><div class="dialog"><div class="name">自分</div>「……先生。去年のこと、聞きたいです。」</div><p>自分が何を忘れたのかは、まだ全部分からない。</p><p>でも、記録を消さずに残すことはできた。</p><hr><p class="muted">翌週。旧校舎のロッカーは撤去された。<br>学校は去年の件について、生徒と保護者への説明を始めた。<br><br>帰り道、スマホに友人からメッセージが届く。<br>『明日、普通に来るよな？』<br><br>あなたは少しだけ迷ってから、『行く』と返した。</p><button class="choice primary" onclick="reset()">タイトルへ</button>`);else if(t==='normal')sheet(`<div class="titleline">NORMAL END</div><p>非常口から外へ出た。</p><p>翌朝、学校は何事もなかったように始まる。</p><p>出席簿の自分の欄だけが、いつの間にか『出席』に直されていた。</p><button class="choice" onclick="reset()">タイトルへ</button>`);else sheet(`<div class="titleline badtext">BAD END</div><p>去年の記録を削除した。</p><p class="code">DELETE COMPLETE</p><p>翌日、教室で目を覚ます。</p><p>壁時計は17:18で止まっている。</p><button class="choice bad" onclick="reset()">タイトルへ</button>`)}function reset(){localStorage.removeItem('schoolEscapePremiumStableV2');location.reload()}
function panel(type){if(type==='items')sheet('<h2>持ち物</h2>'+(S.items.length?S.items.map(x=>`<div class="item"><b>${x.name}</b>${x.desc}</div>`).join(''):'<p>何もない。</p>'));else if(type==='clues')sheet('<h2>手掛かり</h2>'+(S.clues.length?S.clues.map(x=>`<div class="clue"><b>${x.name}</b>${x.desc}</div>`).join(''):'<p>まだない。</p>'));else if(type==='log')sheet('<h2>行動ログ</h2>'+(S.logs.length?S.logs.slice().reverse().map(x=>`<div class="log">${x}</div>`).join(''):'<p>まだない。</p>'));else if(type==='map')sheet('<h2>移動</h2>'+Object.keys(rooms).map(r=>`<button class="choice" ${can(r)?'':'disabled'} onclick="closeSheet();go('${r}')">${can(r)?rooms[r].name:'未確認区画'}</button>`).join(''));else{let l=S.hint[S.chapter]||0;sheet(`<h2>ヒント</h2><p>${hint(S.chapter,l)}</p><button class="choice" onclick="moreHint()">もう少しヒント</button>`)}}function moreHint(){S.hint[S.chapter]=(S.hint[S.chapter]||0)+1;sv();panel('hint')}function hint(ch,l){let H={0:['まず現在時刻と、学校の予定を確認しよう。','黒板の完全下校時刻を見る。'],1:['職員室には今日の記録がある。','出席簿とPCログを確認しよう。'],2:['理科室の展示装置には手順が残されている。','文化祭準備メモを見る。'],3:['放送室には去年の記録が残っている。','古い録音機を使う。'],4:['旧校舎のロッカーは普通の光では読めない。','理科室で拾ったUVペンを使う。'],5:['最後は謎ではなく選択。記録を残すか消すか。']};let a=H[ch]||['手掛かりを見直そう。'];return a[Math.min(l,a.length-1)]}function menu(){sheet(`<h2>メニュー</h2><button class="choice" onclick="closeSheet()">戻る</button><button class="choice" onclick="showIntro()">遊び方</button><button class="choice bad" onclick="reset()">セーブ削除</button>`)}

<script id="premium-stable-logic-v2">
/* ===== FINAL STATE / NAVIGATION GUARD ===== */
function stableEsc(k){return !!(S.flags&&S.flags["esc_"+k])}

function can(r){
  if(r==="classroom") return true;
  if(r==="hall") return stableEsc("class");
  if(r==="staff") return stableEsc("class");
  if(r==="science") return stableEsc("fire") && S.chapter>=2 && hasItem("staffKey");
  if(r==="broadcast") return stableEsc("fire") && S.chapter>=3 && hasItem("keyTag");
  if(r==="old") return stableEsc("stairs") && S.chapter>=4;
  if(r==="rooftop") return stableEsc("roof") && S.chapter>=5;
  return false;
}

function go(r){
  if(r==="hall"&&!stableEsc("class")){toast("教室の扉はまだ開いていない。");return}
  if((r==="science"||r==="broadcast")&&!stableEsc("fire")){toast("廊下の防火扉が閉じている。");return}
  if(r==="old"&&!stableEsc("stairs")){toast("階段区画が閉じている。");return}
  if(r==="rooftop"&&!stableEsc("roof")){toast("屋上前の扉が閉じている。");return}
  if(!can(r)){toast("まだ移動できない。");return}
  S.room=r;S.view=0;sv();render();
}

/* Map travel obeys exactly the same unlock rules as doors. */
function renderMap(){
  let cells=[];
  for(let y=0;y<5;y++){
    for(let x=0;x<5;x++){
      const r=Object.keys(rooms).find(k=>rooms[k].pos[0]===x&&rooms[k].pos[1]===y);
      if(!r){cells.push('<div class="mapcell"></div>');continue}
      const unlocked=can(r), here=S.room===r;
      const move=unlocked&&!here ? `onclick="go('${r}')"` : "";
      cells.push(`<div class="mapcell ${unlocked?'open':''} ${here?'here':''} ${unlocked&&!here?'tappable':''}" ${move}>
        <span>${unlocked?rooms[r].name:"？"}</span>
        ${here?'<span class="arrow">▲</span>':''}
      </div>`);
    }
  }
  document.getElementById("map").innerHTML=cells.join("");
}

/* Always launch at the locked classroom, regardless of a prior broken build. */
function startGame(){
  S=JSON.parse(JSON.stringify(BASE));
  S.room="classroom"; S.view=0; S.chapter=0; S.flags={};
  S.items=[]; S.clues=[]; S.logs=[]; S.hint={}; S.ending=null;
  localStorage.removeItem("schoolEscapePremiumStableV2");
  document.getElementById("prologue").classList.add("hidden");
  introSequence();
}
function continueGame(){
  ld();
  if(!S.room || !rooms[S.room]) S.room="classroom";
  if(typeof S.view!=="number") S.view=0;
  if(!S.flags) S.flags={};
  document.getElementById("prologue").classList.add("hidden");
  render();
}

/* ===== TITLE MODAL ===== */
function showIntro(){
  const o=document.getElementById("overlay"), c=document.getElementById("sheet");
  c.innerHTML=`
    <h2>あらすじ</h2>
    <p>放課後の教室で目を覚ましたあなた。完全下校時刻を過ぎ、校舎の出口へ続く区画は閉じている。</p>
    <p>まずは身近な道具を使い、<strong>学校から脱出する方法</strong>を探す。探索を進めるうち、去年この学校で起きた事故と、自分の失われた記憶につながる記録が見つかっていく。</p>
    <hr>
    <h2>遊び方</h2>
    <p><strong>左右の矢印</strong>で部屋の4面を見回し、気になる物をタップして調べます。</p>
    <p>鍵・工具・UVライトなどの<strong>持ち物</strong>で物理ロックを解除すると、行ける範囲が広がります。</p>
    <p>一度開放した部屋は<strong>校内マップを直接タップ</strong>して移動できます。未開放区画には移動できません。</p>
    <p><strong>いまの目的</strong>は次の方向だけを示します。答えが必要なときはヒントを段階的に確認できます。</p>
    <button class="choice primary" onclick="closeSheet()">閉じる</button>`;
  o.classList.add("show");
}

/* synopsis modal must be above title */
document.addEventListener("DOMContentLoaded",()=>{
  const o=document.getElementById("overlay");
  if(o) o.style.zIndex="500";
});
</script>

 border-radius:999px;padding:6px 12px;font-size:10px;font-weight:900;
 color:#3b3128;box-shadow:0 3px 10px #2e211728;pointer-events:none;
}

/* evidence status chips */
.status-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.status-chip{padding:5px 8px;border-radius:999px;border:1px solid #b7a78e;background:#fff9ed;font-size:10px;font-weight:800;color:#574b3f}
.status-chip.ok{background:#dfeade;border-color:#7d987f;color:#365842}
.status-chip.lock{background:#ede3d4;color:#796b5d}
.status-chip.alert{background:#f1d9d4;color:#8c3b34;border-color:#b8756c}

/* objective becomes mission card */
.objective-box{position:relative;overflow:hidden}
.objective-box:before{
 content:"MISSION";position:absolute;right:10px;top:8px;
 font-size:10px;font-weight:900;letter-spacing:.16em;color:#a98c6e;opacity:.75
}
.objective-box.urgent{animation:pulseImportant 2.2s ease infinite}

/* scene object hint mode */
.hot rect{transition:fill .15s ease,stroke .15s ease}
body.hint-mode .hot rect{fill:rgba(255,244,210,.07)!important;stroke:rgba(255,235,185,.55)!important;stroke-width:2!important}

/* inventory cards */
.inventory-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.inv-card{
 padding:11px;border:1px solid #b7a78f;border-radius:10px;background:#fff9ed;
 box-shadow:0 3px 9px #3d2b1d16;position:relative;min-height:82px;animation:softIn .18s ease
}
.inv-card b{display:block;font-size:14px;margin-bottom:5px}
.inv-icon{font-size:23px;position:absolute;right:10px;top:8px;opacity:.42}

/* evidence cards */
.evidence-card{border-left:5px solid #7b8f7e!important}
.evidence-card.critical{border-left-color:#a54a41!important}
.evidence-card .ev-tag{font-size:9px;letter-spacing:.09em;font-weight:900;color:#806f5f;margin-bottom:4px}

/* puzzle presentation */
.puzzle-stage{
 background:rgba(255,250,239,.92);border:1px solid #a9957c;border-radius:12px;
 padding:12px;margin:10px 0;box-shadow:0 4px 13px #3d2b1d16
}
.puzzle-stage h3{margin:0 0 7px;color:#5a4635}
.puzzle-meta{font-size:10px;color:#756a5d;margin-bottom:8px}
.puzzle-grid button:hover{transform:translateY(-1px)}
.puzzle-grid button:active{transform:translateY(1px)}

/* reasoning board as corkboard */
.reason-board{
 background:
  radial-gradient(circle at 10px 10px,#a87c52 0 1px,transparent 1.5px),
  #b88a5e;background-size:22px 22px;
 border:7px solid #6b4f38;border-radius:13px;padding:15px;box-shadow:inset 0 0 22px #5a3f2b55
}
.reason-board .boardrow{
 background:#fff6df!important;transform:rotate(-.3deg);box-shadow:0 4px 8px #4b33242b!important
}
.reason-board .boardrow:nth-child(even){transform:rotate(.35deg)}
.reason-pin{display:inline-block;width:9px;height:9px;background:#a94d43;border-radius:50%;box-shadow:0 1px 3px #0004;margin-right:5px}

/* chapter splash */
.chapter-splash{
 position:fixed;z-index:800;inset:0;display:flex;align-items:center;justify-content:center;
 background:rgba(20,23,24,.88);color:white;opacity:0;pointer-events:none;transition:opacity .22s ease
}
.chapter-splash.show{opacity:1}
.chapter-splash .inner{text-align:center;animation:chapterIn .45s ease}
.chapter-splash small{display:block;color:#d7c9b5;letter-spacing:.2em;margin-bottom:8px}
.chapter-splash b{font-size:27px;letter-spacing:.12em}

/* acquire toast */
.acquire{
 position:fixed;z-index:850;left:50%;top:18%;transform:translateX(-50%);
 min-width:min(330px,82vw);background:#fff9ed;color:#2b251f;border:2px solid #91795e;
 border-radius:13px;padding:14px 16px;box-shadow:0 14px 35px #0004;
 opacity:0;pointer-events:none;transition:.22s ease;text-align:center
}
.acquire.show{opacity:1;animation:popIn .24s ease}
.acquire small{display:block;color:#806f5f;font-weight:900;letter-spacing:.12em}
.acquire b{display:block;font-size:17px;margin-top:4px}

/* footer progress */
.progress-strip{margin-top:9px;height:6px;background:#dfd5c6;border:1px solid #b7a78f;border-radius:999px;overflow:hidden}
.progress-strip span{display:block;height:100%;background:linear-gradient(90deg,#7b947d,#b85b50);width:0;transition:width .3s ease}

/* richer title */
.proCard:before{
 content:"ESCAPE MYSTERY";position:absolute;z-index:5;left:50%;top:14px;transform:translateX(-50%);
 color:#efe2ce;font-size:9px;font-weight:900;letter-spacing:.25em;opacity:.8
}
.proCard{position:relative}
.proActions button{position:relative;overflow:hidden}
.proActions button:after{content:"›";position:absolute;right:16px;font-size:22px;top:50%;transform:translateY(-50%);opacity:.5}
.proActions button:disabled:after{display:none}

/* desktop polish */
@media(min-width:820px){
 .card:after{content:"CASE NOTE";position:absolute;right:14px;top:13px;font-size:9px;letter-spacing:.18em;font-weight:900;color:#9f8c72}
 .mapbox:after{content:"開放済みの部屋はタップで移動";display:block;margin-top:12px;font-size:10px;color:#75695d;text-align:center}
}
</style>

<script id="rich-v3-js">
(function(){
  const roomLabels={
    classroom:"2年3組",hall:"2階廊下",staff:"職員室",science:"理科室",
    broadcast:"放送室",old:"旧校舎",rooftop:"屋上前"
  };
  const roomMood={
    classroom:"夕暮れの教室",hall:"人気のない廊下",staff:"無人の職員室",science:"理科実験室",
    broadcast:"静かな放送室",old:"立入禁止の旧校舎",rooftop:"夜の屋上前"
  };

  function ensureRichNodes(){
    if(!document.getElementById("chapterSplash")){
      document.body.insertAdjacentHTML("beforeend",`
        <div id="chapterSplash" class="chapter-splash"><div class="inner"><small>CHAPTER</small><b id="chapterSplashText"></b></div></div>
        <div id="acquire" class="acquire"><small>GET ITEM</small><b id="acquireText"></b></div>`);
    }
  }

  window.showChapterSplash=function(text){
    ensureRichNodes();
    const s=document.getElementById("chapterSplash");
    document.getElementById("chapterSplashText").textContent=text;
    s.classList.add("show");setTimeout(()=>s.classList.remove("show"),900);
  };

  window.showAcquire=function(name){
    ensureRichNodes();
    const a=document.getElementById("acquire");
    document.getElementById("acquireText").textContent=name;
    a.classList.add("show");setTimeout(()=>a.classList.remove("show"),1100);
  };

  const _render=render;
  render=function(){
    _render();
    const sc=document.querySelector(".scene");
    if(sc){
      [...sc.classList].filter(x=>x.startsWith("room-")).forEach(x=>sc.classList.remove(x));
      sc.classList.add("room-"+S.room);
      let cap=sc.querySelector(".room-caption");
      if(!cap){cap=document.createElement("div");cap.className="room-caption";sc.appendChild(cap)}
      cap.textContent=roomMood[S.room]||roomLabels[S.room]||"";
    }
    const ob=document.getElementById("objectiveBox");
    if(ob){
      const urgent=!stableEsc("class")||(!stableEsc("fire")&&S.chapter>=1)||(!stableEsc("exit")&&S.chapter>=5);
      ob.classList.toggle("urgent",urgent);
      if(!ob.querySelector(".progress-strip")){
        const p=document.createElement("div");p.className="progress-strip";p.innerHTML="<span></span>";ob.appendChild(p);
      }
      const p=ob.querySelector(".progress-strip span");
      const pct=Math.max(5,Math.min(100,(S.chapter/6)*100));
      p.style.width=pct+"%";
    }
  };

  const _addItem=addItem;
  addItem=function(id,name,desc){
    const before=hasItem(id);
    _addItem(id,name,desc);
    if(!before&&hasItem(id))showAcquire(name);
  };

  const _panel=panel;
  panel=function(type){
    _panel(type);
    setTimeout(()=>{
      const sh=document.getElementById("sheet");
      if(!sh)return;
      if(type==="items"){
        const items=sh.querySelectorAll(".item");
        if(items.length){
          const wrap=document.createElement("div");wrap.className="inventory-grid";
          items.forEach((el,i)=>{
            el.classList.add("inv-card");el.classList.remove("item");
            el.insertAdjacentHTML("beforeend",`<span class="inv-icon">${["🔑","🪛","🔦","📱","📎","🪪"][i%6]}</span>`);
            wrap.appendChild(el);
          });
          sh.appendChild(wrap);
        }
      }
      if(type==="clues"){
        sh.querySelectorAll(".clue").forEach((el,i)=>{
          el.classList.add("evidence-card");
          if(i%3===0)el.classList.add("critical");
          el.insertAdjacentHTML("afterbegin",`<div class="ev-tag">${i%3===0?"IMPORTANT":"EVIDENCE"}</div>`);
        });
      }
      if(type==="board"){
        const rows=sh.querySelectorAll(".boardrow");
        if(rows.length){
          const rb=document.createElement("div");rb.className="reason-board";
          rows.forEach(r=>{r.insertAdjacentHTML("afterbegin",'<span class="reason-pin"></span>');rb.appendChild(r)});
          const btn=sh.querySelector(".choice.primary");sh.insertBefore(rb,btn||null);
        }
      }
    },0);
  };

  const oldSetEsc=window.setEsc;
  if(typeof oldSetEsc==="function"){
    window.setEsc=function(k){
      oldSetEsc(k);
      const sc=document.querySelector(".scene");if(sc){sc.classList.add("unlock-flash");setTimeout(()=>sc.classList.remove("unlock-flash"),700)}
    };
  }

  document.addEventListener("DOMContentLoaded",()=>{
    ensureRichNodes();
    const hintBtn=[...document.querySelectorAll("button")].find(b=>b.textContent.trim()==="?"); 
    if(hintBtn) hintBtn.addEventListener("dblclick",()=>document.body.classList.toggle("hint-mode"));
  });
})();
</script>

(function(){
  function getLayers(){
    const scene=document.querySelector(".scene");
    if(!scene) return null;
    let img=document.getElementById("sceneV15");
    let hot=document.getElementById("hotV15");
    let lab=document.getElementById("labelV15");
    if(!img){img=document.createElement("div");img.id="sceneV15";scene.appendChild(img);}
    if(!lab){lab=document.createElement("div");lab.id="labelV15";scene.appendChild(lab);}
    if(!hot){hot=document.createElement("div");hot.id="hotV15";scene.appendChild(hot);}
    return {img,hot,lab};
  }

  function sceneKey(){
    return S.room+"_"+S.view;
  }

  function updateWallTagDirect(){
    const wall=document.getElementById("wall");
    if(wall && rooms[S.room]) wall.textContent="壁 "+(S.view+1)+"/"+rooms[S.room].views;
  }

  function switchSceneImageV15(){
    const L=getLayers();
    if(!L) return;

    const key=sceneKey();
    const src=window.SCENE_IMAGES_V15[key+".png"]||"";

    /* HARD SWITCH:
       remove prior node completely, then create a fresh IMG with current key. */
    L.img.innerHTML="";
    const im=new Image();
    im.alt=(rooms[S.room]?rooms[S.room].name:S.room)+" 壁"+(S.view+1);
    im.dataset.sceneKey=key;
    im.decoding="sync";
    im.src=src;
    L.img.appendChild(im);

    /* Rebuild hotspots from the exact current wall. */
    L.hot.innerHTML="";
    L.lab.innerHTML="";
    const spots=window.SCENE_HOTSPOTS_V15[key]||[];
    spots.forEach(o=>{
      const b=document.createElement("button");
      b.type="button";
      b.className="hot-v15";
      b.setAttribute("aria-label",o.label||"調べる");
      b.style.left=(o.x/8)+"%";
      b.style.top=(o.y/5.5)+"%";
      b.style.width=(o.w/8)+"%";
      b.style.height=(o.h/5.5)+"%";
      b.setAttribute("onclick",o.fn);
      L.hot.appendChild(b);

      const t=document.createElement("span");
      t.textContent=o.label||"";
      t.style.left=((o.x+o.w/2)/8)+"%";
      t.style.top=((o.y+o.h+22)/5.5)+"%";
      L.lab.appendChild(t);
    });

    updateWallTagDirect();
  }

  /* Dedicated wall change path. Do not rely on render wrappers. */
  window.changeWallV15=function(delta){
    if(!rooms[S.room]) return;
    S.view=(S.view+delta+rooms[S.room].views)%rooms[S.room].views;
    sv();
    updateWallTagDirect();
    switchSceneImageV15();

    /* Update text/title for that wall AFTER scene switch.
       Existing render may be called, but then we switch the scene again synchronously. */
    try {
      const oldRoom=S.room, oldView=S.view;
      render();
      S.room=oldRoom; S.view=oldView;
    } catch(e) {
      console.error("render after wall switch",e);
    }
    updateWallTagDirect();
    switchSceneImageV15();
  };

  /* Override global turn used by inline arrow buttons. */
  turn=function(d){
    changeWallV15(d);
  };

  /* Any general render/room move gets a final scene refresh. */
  const baseRender=render;
  render=function(){
    baseRender();
    switchSceneImageV15();
  };

  document.addEventListener("DOMContentLoaded",()=>{
    const brand=document.querySelector(".brand");
    if(brand){
      let t=document.getElementById("buildTag");
      if(!t){t=document.createElement("small");t.id="buildTag";brand.appendChild(t);}
      t.textContent="RICH v15";
    }

    /* Force nav buttons to call dedicated wall switch explicitly. */
    const navBtns=document.querySelectorAll(".scene .nav button,.scene .turn button");
    if(navBtns.length>=2){
      navBtns[0].setAttribute("onclick","changeWallV15(-1)");
      navBtns[1].setAttribute("onclick","changeWallV15(1)");
    }

    setTimeout(()=>{
      updateWallTagDirect();
      switchSceneImageV15();
    },50);
  });
})();
</script>
